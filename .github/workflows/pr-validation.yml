name: PR Validation

on:
  pull_request:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install commitizen
        run: pip install commitizen

      - name: Check commit messages follow Conventional Commits
        run: cz check --rev-range origin/${{ github.base_ref }}..HEAD

  pr-size:
    runs-on: ubuntu-latest
    steps:
      - name: Warn if PR is too large
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const changes = pr.additions + pr.deletions;
            if (changes > 500) {
              github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `⚠️ This PR changes ${changes} lines. Consider splitting it into smaller PRs for easier review.`,
              });
            }

  labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml

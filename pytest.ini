[pytest]
testpaths = tests
asyncio_mode = auto
addopts =
    --cov=kube_orchestrator
    --cov-report=term-missing
    --cov-report=xml
    -v
; --cov-fail-under=100 is NOT set here on purpose: these addopts apply to
; every pytest invocation, including `pytest tests/integration/` in CI,
; which only exercises a handful of workflows against a real cluster and
; can never reach 100%. The unit-tests CI job passes --cov-fail-under=100
; explicitly on its own command line instead.
markers =
    unit: unit tests (deselect with '-m "not unit"')
    integration: integration tests requiring a real cluster
    slow: slow tests (deselect with '-m "not slow"')
